openapi: 3.0.3
info:
  title: EventSphere Expo Management API
  description: |
    Organizer dashboard endpoints for managing expo events, floor plans, schedules, exhibitor approvals, and analytics.

    **Role Requirements**: All endpoints require authenticated user with 'organizer' or 'admin' role.

    **Functional Requirements**:
    - FR-008 to FR-016: Organizer dashboard capabilities
    - FR-034 to FR-036: Real-time update propagation (<5 seconds)
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://api.eventsphere.com/v1
    description: Production

tags:
  - name: Expo Events
    description: Create, read, update, delete expo events
  - name: Floor Plans
    description: Manage interactive floor plans and booth spaces
  - name: Exhibitor Management
    description: Approve/reject exhibitor applications
  - name: Schedules
    description: Create and manage event schedules with sessions
  - name: Analytics
    description: Real-time analytics and reporting

paths:
  /expos:
    get:
      tags:
        - Expo Events
      summary: List all expos for organizer
      description: |
        Retrieve all expo events managed by the authenticated organizer.
        Implements FR-008 (view expo events).
      operationId: listExpos
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by expo status
          schema:
            type: string
            enum: [draft, upcoming, active, completed, cancelled]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of expos retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      expos:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpoSummary'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Expo Events
      summary: Create new expo event
      description: |
        Create a new expo event with required details.
        Implements FR-008 (create expo event).

        **Business Rules**:
        - Authenticated user becomes the organizer
        - Initial status is 'draft'
        - Start date must be in the future
        - End date must be after start date
      operationId: createExpo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpoRequest'
      responses:
        '201':
          description: Expo created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Expo created successfully
                  data:
                    $ref: '#/components/schemas/ExpoDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}:
    get:
      tags:
        - Expo Events
      summary: Get expo details
      description: |
        Retrieve detailed information about a specific expo.
        Implements FR-008 (view expo details).
      operationId: getExpo
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Expo details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ExpoDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Expo Events
      summary: Update expo event
      description: |
        Update expo event details.
        Implements FR-009 (edit expo event).

        **Business Rules**:
        - Only organizer who created expo can update
        - Changes propagate to all users via real-time updates (FR-036)
        - Cannot update status to 'completed' manually (auto-transitions on end date)
      operationId: updateExpo
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpoRequest'
      responses:
        '200':
          description: Expo updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Expo updated successfully. Changes propagated to all users.
                  data:
                    $ref: '#/components/schemas/ExpoDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Expo Events
      summary: Delete expo event
      description: |
        Delete expo event and all associated data.
        Implements FR-009 (delete expo event).

        **Business Rules**:
        - Only organizer who created expo can delete
        - Cascades to delete floor plans, sessions, booth assignments
        - Notifies all registered exhibitors and attendees
        - Cannot delete expos with active exhibitor registrations (must cancel first)
      operationId: deleteExpo
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      responses:
        '200':
          description: Expo deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Expo deleted successfully
        '400':
          description: Cannot delete expo with active registrations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Cannot delete expo with active exhibitor registrations
                errorCode: ACTIVE_REGISTRATIONS_EXIST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/floor-plan:
    get:
      tags:
        - Floor Plans
      summary: Get expo floor plan
      description: |
        Retrieve floor plan for specific expo.
        Implements FR-012 (view floor plan).
      operationId: getFloorPlan
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      responses:
        '200':
          description: Floor plan retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FloorPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Floor Plans
      summary: Create floor plan for expo
      description: |
        Create interactive floor plan and define booth spaces.
        Implements FR-012 (create floor plan).

        **Business Rules**:
        - One floor plan per expo
        - Booth identifiers must be unique within expo
      operationId: createFloorPlan
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFloorPlanRequest'
      responses:
        '201':
          description: Floor plan created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Floor plan created successfully
                  data:
                    $ref: '#/components/schemas/FloorPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Floor plan already exists for this expo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Floor plan already exists for this expo
                errorCode: FLOOR_PLAN_EXISTS
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/booths:
    post:
      tags:
        - Floor Plans
      summary: Add booth space to floor plan
      description: |
        Define new booth space on existing floor plan.
        Implements FR-012 (define booth spaces).
      operationId: addBoothSpace
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoothSpaceRequest'
      responses:
        '201':
          description: Booth space created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Booth space added successfully
                  data:
                    $ref: '#/components/schemas/BoothSpace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Booth identifier already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Booth identifier already exists in this expo
                errorCode: BOOTH_IDENTIFIER_EXISTS
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/booths/{boothId}/assign:
    post:
      tags:
        - Floor Plans
      summary: Assign exhibitor to booth
      description: |
        Assign approved exhibitor to specific booth space.
        Implements FR-013 (assign exhibitor to booth).

        **Business Rules**:
        - Exhibitor must have 'approved' status
        - Booth must be 'available' status
        - Assignment propagates via real-time updates (FR-035)
      operationId: assignExhibitorToBooth
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: boothId
          in: path
          required: true
          description: Booth ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - exhibitorProfileId
              properties:
                exhibitorProfileId:
                  type: string
                  example: 507f1f77bcf86cd799439020
      responses:
        '200':
          description: Exhibitor assigned to booth successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Exhibitor assigned to booth successfully
                  data:
                    $ref: '#/components/schemas/BoothSpace'
        '400':
          description: Invalid assignment (exhibitor not approved or booth not available)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                exhibitorNotApproved:
                  value:
                    success: false
                    message: Exhibitor must be approved before booth assignment
                    errorCode: EXHIBITOR_NOT_APPROVED
                boothNotAvailable:
                  value:
                    success: false
                    message: Booth is not available
                    errorCode: BOOTH_NOT_AVAILABLE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/exhibitors:
    get:
      tags:
        - Exhibitor Management
      summary: List exhibitor applications
      description: |
        View all exhibitor registration applications for expo.
        Implements FR-011 (view exhibitor applications).
      operationId: listExhibitorApplications
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: status
          in: query
          description: Filter by registration status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Exhibitor applications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExhibitorApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/exhibitors/{exhibitorId}/approve:
    post:
      tags:
        - Exhibitor Management
      summary: Approve exhibitor application
      description: |
        Approve pending exhibitor registration.
        Implements FR-011 (approve exhibitor).

        **Business Rules**:
        - Exhibitor must have 'pending' status
        - Approval email sent to exhibitor
        - Exhibitor gains access to booth selection
      operationId: approveExhibitor
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: exhibitorId
          in: path
          required: true
          description: Exhibitor Profile ID
          schema:
            type: string
      responses:
        '200':
          description: Exhibitor approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Exhibitor approved successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/exhibitors/{exhibitorId}/reject:
    post:
      tags:
        - Exhibitor Management
      summary: Reject exhibitor application
      description: |
        Reject pending exhibitor registration with reason.
        Implements FR-011 (reject exhibitor).

        **Business Rules**:
        - Exhibitor must have 'pending' status
        - Rejection reason required
        - Rejection email sent to exhibitor
      operationId: rejectExhibitor
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: exhibitorId
          in: path
          required: true
          description: Exhibitor Profile ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  example: Company does not match expo theme requirements
      responses:
        '200':
          description: Exhibitor rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Exhibitor application rejected
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/sessions:
    get:
      tags:
        - Schedules
      summary: List expo sessions
      description: |
        Retrieve all sessions/workshops for expo.
        Implements FR-015 (view sessions).
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Schedules
      summary: Create session
      description: |
        Create new session/workshop for expo schedule.
        Implements FR-010 (create session).

        **Business Rules**:
        - Session time must be within expo date range
        - Room must not have overlapping sessions
        - Changes propagate via real-time updates (FR-034)
      operationId: createSession
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session created successfully
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Scheduling conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Room has overlapping session at this time
                errorCode: SCHEDULING_CONFLICT
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/sessions/{sessionId}:
    put:
      tags:
        - Schedules
      summary: Update session
      description: |
        Update session details.
        Implements FR-015 (manage sessions).

        **Business Rules**:
        - Changes notify all registered attendees
        - Real-time updates propagated (FR-034)
      operationId: updateSession
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          description: Session ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Session updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session updated. Notifications sent to registered attendees.
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Schedules
      summary: Delete session
      description: |
        Delete session from schedule.
        Implements FR-015 (manage sessions).

        **Business Rules**:
        - Notifies all registered attendees
        - Cancels all session bookmarks
      operationId: deleteSession
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          description: Session ID
          schema:
            type: string
      responses:
        '200':
          description: Session deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session deleted. Attendees notified.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/analytics:
    get:
      tags:
        - Analytics
      summary: Get expo analytics
      description: |
        Retrieve real-time analytics for expo.
        Implements FR-014 (generate analytics).

        **Metrics Include**:
        - Total attendee registrations
        - Session popularity (registrations per session)
        - Booth traffic (if tracking implemented)
        - Engagement rates
      operationId: getExpoAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: metricType
          in: query
          description: Filter by metric type
          schema:
            type: string
            enum: [attendee-count, session-popularity, booth-traffic, engagement-rate]
      responses:
        '200':
          description: Analytics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Analytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expos/{expoId}/analytics/export:
    get:
      tags:
        - Analytics
      summary: Export analytics report
      description: |
        Export analytics report in downloadable format.
        Implements FR-014 (export analytics).
      operationId: exportAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [pdf, csv, json]
            default: pdf
      responses:
        '200':
          description: Analytics report generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExpoSummary:
      type: object
      properties:
        expoId:
          type: string
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          example: Tech Expo 2025
        status:
          type: string
          enum: [draft, upcoming, active, completed, cancelled]
