              type: string
              format: date-time
            duration:
              type: integer
        location:
          type: object
          properties:
            room:
              type: string
            building:
              type: string
        capacity:
          type: integer
        currentAttendees:
          type: integer
        topic:
          type: string
        category:
          type: string

    CreateSessionRequest:
      type: object
      required:
        - title
        - description
        - schedule
        - location
        - capacity
        - topic
        - category
      properties:
        title:
          type: string
          example: Keynote - AI in Enterprise
        description:
          type: string
        speakers:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              title:
                type: string
              bio:
                type: string
        schedule:
          type: object
          required:
            - startTime
            - endTime
          properties:
            startTime:
              type: string
              format: date-time
            endTime:
              type: string
              format: date-time
        location:
          type: object
          required:
            - room
          properties:
            room:
              type: string
            building:
              type: string
        capacity:
          type: integer
          minimum: 1
        topic:
          type: string
        category:
          type: string

    UpdateSessionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        speakers:
          type: array
          items:
            type: object
        schedule:
          type: object
          properties:
            startTime:
              type: string
              format: date-time
            endTime:
              type: string
              format: date-time
        location:
          type: object
          properties:
            room:
              type: string
            building:
              type: string
        capacity:
          type: integer

    Analytics:
      type: object
      properties:
        expoId:
          type: string
        metrics:
          type: object
          properties:
            attendeeCount:
              type: object
              properties:
                total:
                  type: integer
                registered:
                  type: integer
                checkedIn:
                  type: integer
            sessionPopularity:
              type: array
              items:
                type: object
                properties:
                  sessionId:
                    type: string
                  title:
                    type: string
                  registrations:
                    type: integer
                  capacity:
                    type: integer
                  utilizationPercent:
                    type: number
            boothTraffic:
              type: array
              items:
                type: object
                properties:
                  boothId:
                    type: string
                  identifier:
                    type: string
                  exhibitor:
                    type: string
                  visits:
                    type: integer
            engagementRate:
              type: number
              example: 78.5
        generatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorCode:
          type: string
        details:
          type: object

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5
        totalItems:
          type: integer
          example: 95
        itemsPerPage:
          type: integer
          example: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions (requires organizer/admin role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []
