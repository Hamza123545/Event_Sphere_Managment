        dateRange:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
              example: 2025-06-15T09:00:00Z
            endDate:
              type: string
              format: date-time
              example: 2025-06-17T18:00:00Z
        location:
          type: object
          properties:
            venueName:
              type: string
              example: Convention Center
            city:
              type: string
              example: San Francisco
        stats:
          type: object
          properties:
            exhibitorCount:
              type: integer
              example: 45
            attendeeCount:
              type: integer
              example: 320

    ExpoDetail:
      allOf:
        - $ref: '#/components/schemas/ExpoSummary'
        - type: object
          properties:
            description:
              type: string
            theme:
              type: string
            location:
              type: object
              properties:
                venueName:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                zipCode:
                  type: string
            organizer:
              type: object
              properties:
                userId:
                  type: string
                name:
                  type: string
            floorPlan:
              type: object
              nullable: true
              properties:
                floorPlanId:
                  type: string
                name:
                  type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CreateExpoRequest:
      type: object
      required:
        - title
        - description
        - dateRange
        - location
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
          example: Tech Expo 2025
        description:
          type: string
          minLength: 20
          maxLength: 5000
          example: Annual technology expo showcasing latest innovations
        theme:
          type: string
          maxLength: 200
          example: Innovation & Digital Transformation
        dateRange:
          type: object
          required:
            - startDate
            - endDate
          properties:
            startDate:
              type: string
              format: date-time
              example: 2025-06-15T09:00:00Z
            endDate:
              type: string
              format: date-time
              example: 2025-06-17T18:00:00Z
        location:
          type: object
          required:
            - venueName
            - address
            - city
            - country
          properties:
            venueName:
              type: string
              example: Moscone Convention Center
            address:
              type: string
              example: 747 Howard St
            city:
              type: string
              example: San Francisco
            state:
              type: string
              example: California
            country:
              type: string
              example: United States
            zipCode:
              type: string
              example: 94103

    UpdateExpoRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        theme:
          type: string
        dateRange:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
        location:
          type: object
          properties:
            venueName:
              type: string
            address:
              type: string
            city:
              type: string
            state:
              type: string
            country:
              type: string
            zipCode:
              type: string
        status:
          type: string
          enum: [draft, upcoming, active, cancelled]

    FloorPlan:
      type: object
      properties:
        floorPlanId:
          type: string
        expo:
          type: string
        name:
          type: string
        dimensions:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
        imageUrl:
          type: string
        metadata:
          type: object
          properties:
            scale:
              type: number
            totalBooths:
              type: integer
            availableBooths:
              type: integer
        booths:
          type: array
          items:
            $ref: '#/components/schemas/BoothSpace'

    CreateFloorPlanRequest:
      type: object
      required:
        - name
        - dimensions
      properties:
        name:
          type: string
          example: Main Exhibition Hall
        dimensions:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
              example: 200
            height:
              type: number
              example: 150
        imageUrl:
          type: string
          example: https://cdn.eventsphere.com/floorplans/expo123.png
        metadata:
          type: object
          properties:
            scale:
              type: number
              example: 10

    BoothSpace:
      type: object
      properties:
        boothId:
          type: string
        identifier:
          type: string
          example: A-101
        size:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
            area:
              type: number
        location:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        amenities:
          type: array
          items:
            type: string
          example: [power, wifi, storage]
        priceTier:
          type: string
          enum: [standard, premium, deluxe]
        status:
          type: string
          enum: [available, reserved, occupied]
        exhibitor:
          type: object
          nullable: true
          properties:
            exhibitorId:
              type: string
            companyName:
              type: string

    CreateBoothSpaceRequest:
      type: object
      required:
        - identifier
        - size
        - location
      properties:
        identifier:
          type: string
          example: A-101
        size:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
              example: 3
            height:
              type: number
              example: 3
        location:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
              example: 10.5
            y:
              type: number
              example: 20.0
        amenities:
          type: array
          items:
            type: string
          example: [power, wifi]
        priceTier:
          type: string
          enum: [standard, premium, deluxe]
          example: standard

    ExhibitorApplication:
      type: object
      properties:
        exhibitorId:
          type: string
        companyName:
          type: string
        category:
          type: string
        contactEmail:
          type: string
        registrationStatus:
          type: string
          enum: [pending, approved, rejected]
        submittedAt:
          type: string
          format: date-time
        documents:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              url:
                type: string

    Session:
      type: object
      properties:
        sessionId:
          type: string
        title:
          type: string
        description:
          type: string
        speakers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
        schedule:
          type: object
          properties:
            startTime:
              type: string
              format: date-time
