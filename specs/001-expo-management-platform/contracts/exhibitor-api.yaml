openapi: 3.0.3
info:
  title: EventSphere Exhibitor Portal API
  description: |
    Exhibitor portal endpoints for registration, booth management, and communication.

    **Role Requirements**: All endpoints require authenticated user with 'exhibitor' role.

    **Functional Requirements**:
    - FR-017 to FR-024: Exhibitor portal capabilities
    - FR-035: Real-time booth allocation updates (<5 seconds)
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://api.eventsphere.com/v1
    description: Production

tags:
  - name: Exhibitor Registration
    description: Register for expos and manage exhibitor profiles
  - name: Booth Management
    description: View floor plans and select booth spaces
  - name: Communication
    description: Messaging with organizers and other exhibitors

paths:
  /exhibitor/expos:
    get:
      tags:
        - Exhibitor Registration
      summary: Browse available expos
      description: |
        View all available expos for exhibitor registration.
        Implements FR-017 (browse expos for registration).
      operationId: browseExpos
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by expo status
          schema:
            type: string
            enum: [upcoming, active]
        - name: category
          in: query
          description: Filter by expo category/theme
          schema:
            type: string
      responses:
        '200':
          description: Available expos retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      expos:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpoListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/expos/{expoId}/register:
    post:
      tags:
        - Exhibitor Registration
      summary: Register for expo
      description: |
        Submit exhibitor registration for expo.
        Implements FR-017 (register for expo).

        **Business Rules**:
        - Registration status starts as 'pending'
        - Document uploads limited to 10MB per file (PDF, JPG, PNG only)
        - Organizer approval required before booth selection
      operationId: registerForExpo
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - companyName
                - description
                - productsServices
                - category
                - contactEmail
              properties:
                companyName:
                  type: string
                  minLength: 2
                  maxLength: 200
                  example: TechCorp Solutions
                description:
                  type: string
                  minLength: 20
                  maxLength: 2000
                  example: Leading provider of enterprise cloud solutions
                productsServices:
                  type: array
                  items:
                    type: string
                  example: [Cloud Computing, AI Solutions, Data Analytics]
                category:
                  type: string
                  example: Technology
                contactEmail:
                  type: string
                  format: email
                  example: contact@techcorp.com
                contactPhone:
                  type: string
                  example: +1-555-987-6543
                website:
                  type: string
                  format: uri
                  example: https://techcorp.com
                logo:
                  type: string
                  format: binary
                  description: Company logo (max 5MB, PNG/JPG)
                documents:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Company documents (catalogs, profiles, max 10MB each)
      responses:
        '201':
          description: Registration submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Registration submitted successfully. Pending organizer approval.
                  data:
                    $ref: '#/components/schemas/ExhibitorProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Already registered for this expo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: You have already registered for this expo
                errorCode: ALREADY_REGISTERED
        '413':
          description: File size exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: File size exceeds 10MB limit
                errorCode: FILE_TOO_LARGE
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/profile:
    get:
      tags:
        - Exhibitor Registration
      summary: Get all exhibitor profiles
      description: |
        Retrieve all exhibitor profiles for authenticated user.
        Implements FR-019 (view exhibitor profiles).
      operationId: getExhibitorProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exhibitor profiles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      profiles:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExhibitorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/profile/{profileId}:
    get:
      tags:
        - Exhibitor Registration
      summary: Get exhibitor profile details
      description: |
        Retrieve specific exhibitor profile details.
        Implements FR-019 (view profile).
      operationId: getExhibitorProfile
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Exhibitor Profile ID
          schema:
            type: string
      responses:
        '200':
          description: Exhibitor profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ExhibitorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Exhibitor Registration
      summary: Update exhibitor profile
      description: |
        Update exhibitor profile information.
        Implements FR-019 (update profile).

        **Business Rules**:
        - Can only update own profiles
        - Cannot update after organizer approval (contact organizer for changes)
      operationId: updateExhibitorProfile
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Exhibitor Profile ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                description:
                  type: string
                productsServices:
                  type: array
                  items:
                    type: string
                contactEmail:
                  type: string
                  format: email
                contactPhone:
                  type: string
                website:
                  type: string
                logo:
                  type: string
                  format: binary
                additionalDocuments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profile updated successfully
                  data:
                    $ref: '#/components/schemas/ExhibitorProfile'
        '400':
          description: Cannot update approved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Cannot update approved profile. Contact organizer for changes.
                errorCode: PROFILE_LOCKED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/profile/{profileId}/booth:
    get:
      tags:
        - Booth Management
      summary: Get assigned booth details
      description: |
        Retrieve details of assigned booth for exhibitor profile.
        Implements FR-022 (view booth details).
      operationId: getAssignedBooth
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Exhibitor Profile ID
          schema:
            type: string
      responses:
        '200':
          description: Booth details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BoothDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No booth assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: No booth assigned to this profile
                errorCode: NO_BOOTH_ASSIGNED
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Booth Management
      summary: Update booth details
      description: |
        Update booth information (products showcased, staff).
        Implements FR-022 (manage booth details).
      operationId: updateBoothDetails
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Exhibitor Profile ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productsShowcased:
                  type: array
                  items:
                    type: string
                  example: [AI Platform v2.0, Cloud Solutions Suite]
                staff:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      role:
                        type: string
                      email:
                        type: string
                  example:
                    - name: John Smith
                      role: Sales Manager
                      email: john@techcorp.com
      responses:
        '200':
          description: Booth details updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Booth details updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/expos/{expoId}/floor-plan:
    get:
      tags:
        - Booth Management
      summary: View expo floor plan
      description: |
        View interactive floor plan with booth availability.
        Implements FR-020 (view floor plan).

        **Business Rules**:
        - Shows all booths with status (available, reserved, occupied)
        - Real-time updates when booth status changes (FR-035)
        - Requires approved exhibitor status to see pricing
      operationId: viewFloorPlan
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
      responses:
        '200':
          description: Floor plan retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FloorPlanWithAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/expos/{expoId}/booths/{boothId}/reserve:
    post:
      tags:
        - Booth Management
      summary: Reserve booth space
      description: |
        Select and reserve available booth space.
        Implements FR-021 (select and reserve booth).

        **Business Rules**:
        - Exhibitor must have 'approved' status for this expo
        - Booth must have 'available' status
        - Optimistic locking prevents concurrent reservations
        - Reservation propagates via real-time updates (FR-035)
      operationId: reserveBooth
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: boothId
          in: path
          required: true
          description: Booth ID
          schema:
            type: string
      responses:
        '200':
          description: Booth reserved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Booth A-101 reserved successfully
                  data:
                    $ref: '#/components/schemas/BoothDetails'
        '400':
          description: Exhibitor not approved or already has booth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notApproved:
                  value:
                    success: false
                    message: Exhibitor must be approved before booth reservation
                    errorCode: EXHIBITOR_NOT_APPROVED
                alreadyHasBooth:
                  value:
                    success: false
                    message: Exhibitor already has a booth assigned
                    errorCode: BOOTH_ALREADY_ASSIGNED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booth not available or concurrent reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Booth is no longer available
                errorCode: BOOTH_NOT_AVAILABLE
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/expos/{expoId}/exhibitors:
    get:
      tags:
        - Communication
      summary: View other exhibitors
      description: |
        View list of other exhibitors in same expo.
        Implements FR-024 (view neighboring exhibitors).
      operationId: listExhibitors
      security:
        - bearerAuth: []
      parameters:
        - name: expoId
          in: path
          required: true
          description: Expo ID
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
      responses:
        '200':
          description: Exhibitors retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      exhibitors:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExhibitorListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/messages:
    get:
      tags:
        - Communication
      summary: Get messages
      description: |
        Retrieve all messages for exhibitor.
        Implements FR-023, FR-024 (messaging).
      operationId: getExhibitorMessages
      security:
        - bearerAuth: []
      parameters:
        - name: context
          in: query
          description: Filter by message context
          schema:
            type: string
            enum: [general-inquiry, exhibitor-collaboration, support-request, organizer-communication]
        - name: unreadOnly
          in: query
          description: Show only unread messages
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Communication
      summary: Send message
      description: |
        Send message to organizer or other exhibitor.
        Implements FR-023, FR-024 (send messages).
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientId
                - content
                - context
              properties:
                recipientId:
                  type: string
                  example: 507f1f77bcf86cd799439030
                  description: User ID of recipient (organizer or exhibitor)
                subject:
                  type: string
                  maxLength: 200
                  example: Collaboration opportunity
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  example: Hi, I'd like to discuss a potential collaboration opportunity...
                context:
                  type: string
                  enum: [general-inquiry, exhibitor-collaboration, support-request, organizer-communication]
                  example: exhibitor-collaboration
                relatedExpoId:
                  type: string
                  description: Optional expo context
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Message sent successfully
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Recipient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Recipient user not found
                errorCode: RECIPIENT_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exhibitor/messages/{messageId}/read:
    put:
      tags:
        - Communication
      summary: Mark message as read
      description: |
        Mark specific message as read.
      operationId: markMessageRead
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          description: Message ID
          schema:
            type: string
      responses:
        '200':
          description: Message marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Message marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExpoListing:
      type: object
      properties:
        expoId:
          type: string
        title:
          type: string
        description:
          type: string
        theme:
          type: string
        dateRange:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
        location:
          type: object
          properties:
            venueName:
              type: string
            city:
              type: string
            country:
              type: string
        status:
          type: string
          enum: [upcoming, active]
        stats:
          type: object
          properties:
            exhibitorCount:
              type: integer
            availableBooths:
              type: integer

    ExhibitorProfile:
      type: object
      properties:
        profileId:
          type: string
        expo:
          type: object
          properties:
            expoId:
              type: string
            title:
              type: string
        companyName:
          type: string
        description:
          type: string
        logo:
          type: string
        productsServices:
          type: array
          items:
            type: string
        category:
          type: string
        documents:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              url:
                type: string
              uploadedAt:
                type: string
                format: date-time
        contactInfo:
          type: object
          properties:
            email:
              type: string
            phone:
              type: string
            website:
              type: string
        registrationStatus:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: string
          nullable: true
        booth:
          type: object
          nullable: true
          properties:
            boothId:
              type: string
            identifier:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BoothDetails:
      type: object
      properties:
        boothId:
          type: string
        identifier:
          type: string
        size:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
            area:
              type: number
        location:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        amenities:
          type: array
          items:
            type: string
        priceTier:
          type: string
          enum: [standard, premium, deluxe]
        status:
          type: string
          enum: [reserved, occupied]
        productsShowcased:
          type: array
          items:
            type: string
        staff:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              role:
                type: string
              email:
                type: string
        reservedAt:
          type: string
          format: date-time

    FloorPlanWithAvailability:
      type: object
      properties:
        floorPlanId:
          type: string
        name:
          type: string
        dimensions:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
        imageUrl:
          type: string
        metadata:
          type: object
          properties:
            totalBooths:
              type: integer
            availableBooths:
              type: integer
        booths:
          type: array
          items:
            type: object
            properties:
              boothId:
                type: string
              identifier:
                type: string
              size:
                type: object
                properties:
                  area:
                    type: number
              location:
                type: object
                properties:
                  x:
                    type: number
                  y:
                    type: number
              amenities:
                type: array
                items:
                  type: string
              priceTier:
                type: string
              status:
                type: string
                enum: [available, reserved, occupied]

    ExhibitorListing:
      type: object
      properties:
        profileId:
          type: string
        companyName:
          type: string
        logo:
          type: string
        category:
          type: string
        booth:
          type: object
          nullable: true
          properties:
            identifier:
              type: string

    Message:
      type: object
      properties:
        messageId:
          type: string
        sender:
          type: object
          properties:
            userId:
              type: string
            name:
              type: string
            role:
              type: string
        recipient:
          type: object
          properties:
            userId:
              type: string
            name:
              type: string
        subject:
          type: string
        content:
          type: string
        context:
          type: string
          enum: [general-inquiry, exhibitor-collaboration, support-request, organizer-communication]
        relatedExpo:
          type: object
          nullable: true
          properties:
            expoId:
              type: string
            title:
              type: string
        timestamp:
          type: string
          format: date-time
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorCode:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions (requires exhibitor role or ownership)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []
