openapi: 3.0.0
info:
  title: EventSphere Exhibitor API
  version: 1.0.0
  description: Exhibitor registration, profile management, and booth selection
servers:
  - url: /api/v1
    description: API Base URL
paths:
  /exhibitors/register:
    post:
      summary: Register as exhibitor
      tags: [Exhibitors]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                contactEmail:
                  type: string
                  format: email
                description:
                  type: string
      responses:
        '201':
          description: Exhibitor registered successfully
  /exhibitors/profile:
    get:
      summary: Get exhibitor profile
      tags: [Exhibitors]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exhibitor profile
    put:
      summary: Update exhibitor profile
      tags: [Exhibitors]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []

